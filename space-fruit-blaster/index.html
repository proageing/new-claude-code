<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>COSMIC CRITTER BLASTER</title>
<style>
  :root{
    --neon-cyan:#3df5ff;
    --neon-magenta:#ff2fd0;
    --neon-yellow:#ffe93d;
    --neon-green:#3dff8a;
    --bg:#04030a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:'Courier New', 'Consolas', monospace;
  }
  #wrap{
    position:relative; width:100vw; height:100vh; display:flex;
    align-items:center; justify-content:center;
  }
  canvas{
    background:radial-gradient(ellipse at 50% 20%, #100a24 0%, #04030a 70%);
    image-rendering:pixelated;
    display:block;
    max-width:100%;
    max-height:100%;
    box-shadow:0 0 40px rgba(61,245,255,0.25), inset 0 0 80px rgba(0,0,0,0.8);
    border:2px solid #1b1440;
  }
  /* CRT scanline + vignette overlay */
  #crt{
    position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 1px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 3px
      );
    mix-blend-mode:multiply;
  }
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 180px 60px rgba(0,0,0,0.85);
  }
  #flash{
    position:absolute; inset:0; pointer-events:none;
    background:rgba(255,40,40,0.0);
    transition:background 60ms linear;
  }

  .glow-cyan{ color:var(--neon-cyan); text-shadow:0 0 6px var(--neon-cyan), 0 0 14px rgba(61,245,255,0.6); }
  .glow-magenta{ color:var(--neon-magenta); text-shadow:0 0 6px var(--neon-magenta), 0 0 14px rgba(255,47,208,0.6); }
  .glow-yellow{ color:var(--neon-yellow); text-shadow:0 0 6px var(--neon-yellow), 0 0 14px rgba(255,233,61,0.6); }

  #overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    color:var(--neon-cyan); background:rgba(2,1,8,0.72); gap:14px;
    padding:20px;
  }
  #overlay h1{
    font-size:clamp(22px,5.4vw,48px); letter-spacing:4px; margin:0;
    color:var(--neon-magenta); text-shadow:0 0 8px var(--neon-magenta), 0 0 26px rgba(255,47,208,0.7);
  }
  #overlay .sub{ font-size:clamp(10px,2.1vw,15px); letter-spacing:2px; color:var(--neon-cyan); opacity:0.9; }
  #overlay .critterrow{ font-size:clamp(11px,2.3vw,14px); letter-spacing:3px; margin:8px 0; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #overlay .critterrow span{ padding:3px 8px; border:1px solid currentColor; border-radius:3px; opacity:0.9; }
  #overlay .blink{ animation:blink 1s steps(1) infinite; margin-top:10px; font-size:clamp(11px,2.4vw,16px); letter-spacing:2px; }
  #overlay .legend{ font-size:clamp(9px,1.8vw,12px); line-height:1.9; color:#9fe8ff; opacity:0.85; letter-spacing:1px; }
  @keyframes blink{ 50%{ opacity:0; } }
  .hidden{ display:none !important; }

  #hud{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:10px 14px; font-size:clamp(10px,2vw,16px); letter-spacing:2px; pointer-events:none;
  }
  #hud span{ display:block; }

  #touch{
    position:absolute; bottom:14px; left:0; right:0; display:none;
    justify-content:space-between; padding:0 16px; pointer-events:none;
  }
  #touch button{
    pointer-events:auto; width:64px; height:64px; border-radius:50%;
    background:rgba(61,245,255,0.12); border:2px solid var(--neon-cyan);
    color:var(--neon-cyan); font-size:22px; font-family:inherit;
  }
  #touch #fireBtn{
    background:rgba(255,47,208,0.14); border-color:var(--neon-magenta); color:var(--neon-magenta);
    width:76px; height:76px;
  }
  #touch .dpad{ display:flex; gap:10px; }
  @media (pointer:coarse){ #touch{ display:flex; } }

  #soundBtn{
    position:absolute; top:34px; right:10px; z-index:5;
    pointer-events:auto; background:rgba(61,245,255,0.08); border:1px solid rgba(61,245,255,0.45);
    color:var(--neon-cyan); font-size:15px; line-height:1; border-radius:6px; padding:5px 8px;
    cursor:pointer; font-family:inherit;
  }
  #soundBtn:focus-visible{ outline:2px solid var(--neon-yellow); outline-offset:2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="hud">
    <span id="scoreLine" class="glow-cyan">SCORE 0</span>
    <span id="levelLine" class="glow-yellow">SECTOR 1</span>
    <span id="livesLine" class="glow-magenta">SHIPS ▲▲▲</span>
  </div>
  <div id="crt"></div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="overlay">
    <h1>COSMIC CRITTER BLASTER</h1>
    <div class="sub">A RETRO ARCADE VOID DEFENSE</div>
    <div id="critterRow" class="critterrow">
      <span style="color:#5be8c8;">BLIP</span>
      <span style="color:#ffa23d;">ZOG</span>
      <span style="color:#b06bff;">SQUIG</span>
      <span style="color:#3dff8a;">KRIX</span>
      <span style="color:#ff5fb0;">BLORP</span>
      <span style="color:#ff6b4d;">VEX</span>
    </div>
    <div id="menuText" class="legend">
      ARROWS / A-D : MOVE&nbsp;&nbsp;&nbsp; SPACE : FIRE&nbsp;&nbsp;&nbsp; P : PAUSE&nbsp;&nbsp;&nbsp; M : MUTE<br>
      VEX RETURNS FIRE · DODGE MINES &amp; ASTEROIDS · A BOSS AWAITS EVERY 3RD SECTOR
    </div>
    <div id="startPrompt" class="blink glow-yellow">PRESS SPACE TO LAUNCH</div>
    <div id="finalScoreWrap" class="hidden">
      <div id="finalScore" class="sub glow-cyan"></div>
      <div id="highScore" class="sub glow-yellow"></div>
    </div>
  </div>

  <button id="soundBtn" aria-label="Toggle sound">🔊</button>

  <div id="touch">
    <div class="dpad">
      <button id="leftBtn">◀</button>
      <button id="rightBtn">▶</button>
    </div>
    <button id="fireBtn">⚡</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById('overlay');
  const menuText = document.getElementById('menuText');
  const critterRow = document.getElementById('critterRow');
  const startPrompt = document.getElementById('startPrompt');
  const finalScoreWrap = document.getElementById('finalScoreWrap');
  const finalScoreEl = document.getElementById('finalScore');
  const highScoreEl = document.getElementById('highScore');
  const scoreLine = document.getElementById('scoreLine');
  const levelLine = document.getElementById('levelLine');
  const livesLine = document.getElementById('livesLine');
  const flashEl = document.getElementById('flash');
  const soundBtn = document.getElementById('soundBtn');

  const CRITTERS = [
    { key:'blip',  r:15, score:10, speed:1.0,  wobble:0.6, hp:1, color:'#5be8c8' },
    { key:'zog',   r:16, score:15, speed:1.15, wobble:0.8, hp:1, color:'#ffa23d' },
    { key:'squig', r:15, score:20, speed:1.6,  wobble:1.7, hp:1, color:'#b06bff' },
    { key:'blorp', r:17, score:25, speed:1.4,  wobble:1.9, hp:1, color:'#ff5fb0' },
    { key:'krix',  r:22, score:35, speed:0.75, wobble:0.3, hp:2, color:'#3dff8a' },
    { key:'vex',   r:16, score:30, speed:0.9,  wobble:0.5, hp:1, color:'#ff6b4d', shooter:true },
    { key:'nova',  r:16, score:100, speed:1.9, wobble:2.2, hp:1, color:'#ffe93d', rare:true },
  ];
  const MINE = { key:'mine', r:17, speed:1.3, wobble:0.5, hp:1, color:'#ff2f2f' };
  const ASTEROID = { key:'asteroid', r:20, score:5, speed:1.0, wobble:0.15, hp:2, color:'#9aa3ba' };

  let audioCtx = null, masterGain = null, muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try{
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = muted ? 0 : 1;
        masterGain.connect(audioCtx.destination);
      }catch(e){}
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function toggleMute(){
    muted = !muted;
    if(masterGain) masterGain.gain.setTargetAtTime(muted?0:1, audioCtx.currentTime, 0.01);
    soundBtn.textContent = muted ? '🔇' : '🔊';
  }
  function beep({freq=440, dur=0.08, type='square', gain=0.06, slideTo=null, delay=0}){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst({dur=0.2, freq=1200, gain=0.12, filterType='lowpass'}){
    if(!audioCtx) return;
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = filterType; filter.frequency.value = freq;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    src.start(t0);
  }

  function sfxShoot(){ beep({freq:1000, slideTo:340, dur:0.08, type:'square', gain:0.045}); }
  function sfxPop(score){
    const base = 420 + Math.min(score, 100) * 2.4;
    beep({freq:base, slideTo:base*0.32, dur:0.11, type:'sawtooth', gain:0.065});
  }
  function sfxBomb(){
    noiseBurst({dur:0.32, freq:900, gain:0.18, filterType:'lowpass'});
    beep({freq:140, slideTo:30, dur:0.3, type:'square', gain:0.08});
  }
  function sfxHit(){
    beep({freq:220, slideTo:70, dur:0.22, type:'sawtooth', gain:0.09});
    beep({freq:180, slideTo:50, dur:0.28, type:'square', gain:0.07, delay:0.05});
  }
  function sfxLevel(){
    [0,90,180].forEach((t,i)=> setTimeout(()=>beep({freq:520+i*170, dur:0.1, type:'square', gain:0.06}), t));
  }
  function sfxSelect(){ beep({freq:700, slideTo:920, dur:0.06, type:'square', gain:0.05}); }
  function sfxGameOver(){
    [660,560,460,320].forEach((f,i)=> setTimeout(()=>beep({freq:f, dur:0.24, type:'triangle', gain:0.08}), i*160));
  }
  function sfxRock(){
    noiseBurst({dur:0.15, freq:600, gain:0.1, filterType:'lowpass'});
    beep({freq:200, slideTo:90, dur:0.1, type:'square', gain:0.05});
  }
  function sfxEnemyShoot(){ beep({freq:260, slideTo:110, dur:0.09, type:'sawtooth', gain:0.04}); }
  function sfxBossWarn(){
    [0,220,440].forEach((t,i)=> setTimeout(()=>beep({freq: i%2===0?440:330, dur:0.18, type:'square', gain:0.08}), t));
  }
  function sfxBossAppear(){ beep({freq:70, slideTo:180, dur:0.6, type:'sawtooth', gain:0.09}); }
  function sfxBossDefeat(){
    noiseBurst({dur:0.4, freq:800, gain:0.16});
    [520,660,780,940].forEach((f,i)=> setTimeout(()=>beep({freq:f, dur:0.2, type:'square', gain:0.08}), i*120));
  }

  const bassline = [55, 55, 82.41, 65.41, 55, 55, 73.42, 61.74];
  const bossBassline = [98, 98, 110, 98, 123.47, 110, 98, 73.42];
  let musicStep = 0;
  function playMusicStep(){
    const line = bossActive ? bossBassline : bassline;
    beep({freq:line[musicStep % line.length], dur:0.15, type: bossActive?'sawtooth':'triangle', gain:0.05});
    if(musicStep % 2 === 1) noiseBurst({dur:0.04, freq:5000, gain:0.02, filterType:'highpass'});
    musicStep++;
  }

  const keys = {};
  window.addEventListener('keydown', e => {
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    ensureAudio();
    if(e.code === 'Space'){
      if(state === 'menu' || state === 'gameover') startGame();
      else if(state === 'playing') firePressed = true;
    }
    if(e.code === 'KeyP' && (state === 'playing' || state === 'paused')) togglePause();
    if(e.code === 'KeyM') toggleMute();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; if(e.code==='Space') firePressed = false; });

  let touchLeft=false, touchRight=false, touchFire=false;
  const bind = (id, on, off) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e=>{ e.preventDefault(); ensureAudio(); on(); }, {passive:false});
    el.addEventListener('touchend', e=>{ e.preventDefault(); off(); }, {passive:false});
    el.addEventListener('mousedown', ()=>{ ensureAudio(); on(); });
    el.addEventListener('mouseup', ()=> off());
    el.addEventListener('mouseleave', ()=> off());
  };
  bind('leftBtn', ()=>touchLeft=true, ()=>touchLeft=false);
  bind('rightBtn', ()=>touchRight=true, ()=>touchRight=false);
  bind('fireBtn', ()=>{touchFire=true; firePressed=true;}, ()=>{touchFire=false; firePressed=false;});
  overlay.addEventListener('click', ()=>{ ensureAudio(); if(state==='menu'||state==='gameover') startGame(); });

  soundBtn.addEventListener('click', (e)=>{ e.stopPropagation(); ensureAudio(); toggleMute(); });
  soundBtn.addEventListener('touchstart', (e)=>{ e.stopPropagation(); e.preventDefault(); ensureAudio(); toggleMute(); }, {passive:false});

  let state = 'menu'; // menu | playing | paused | gameover
  let score = 0, lives = 3, level = 1, frame = 0;
  let firePressed = false, fireCooldown = 0;
  let spawnTimer = 0, spawnInterval = 70;
  let shakeT = 0;
  let bossActive = false, boss = null, bossWarnT = 0, lastBossLevel = 0;

  const stars = Array.from({length:90}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    z: 0.4 + Math.random()*1.8, size: Math.random()<0.15?2:1
  }));

  const player = { x: W/2, y: H-64, w: 34, h: 30, speed: 5.4, thrust: 0, invulnT: 0 };
  let bullets = [];
  let critters = [];
  let enemyBullets = [];
  let particles = [];

  let highScore = 0;
  try { highScore = parseInt(localStorage.getItem('sfb_highscore')||'0',10) || 0; } catch(e){}

  function resetGame(){
    score = 0; lives = 3; level = 1; frame = 0;
    bullets = []; critters = []; enemyBullets = []; particles = [];
    player.x = W/2; player.y = H-64; player.invulnT = 0;
    spawnInterval = 70; spawnTimer = 0;
    bossActive = false; boss = null; bossWarnT = 0; lastBossLevel = 0;
  }

  function startGame(){
    sfxSelect();
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
  }

  function togglePause(){
    sfxSelect();
    state = state === 'playing' ? 'paused' : 'playing';
    if(state === 'paused'){
      overlay.classList.remove('hidden');
      critterRow.classList.add('hidden');
      menuText.textContent = 'PAUSED';
      startPrompt.textContent = 'PRESS P TO RESUME';
      finalScoreWrap.classList.add('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  function endGame(){
    state = 'gameover';
    sfxGameOver();
    if(score > highScore){ highScore = score; try{ localStorage.setItem('sfb_highscore', String(highScore)); }catch(e){} }
    overlay.classList.remove('hidden');
    critterRow.classList.remove('hidden');
    menuText.innerHTML = 'ARROWS / A-D : MOVE&nbsp;&nbsp;&nbsp; SPACE : FIRE&nbsp;&nbsp;&nbsp; P : PAUSE&nbsp;&nbsp;&nbsp; M : MUTE<br>VEX RETURNS FIRE · DODGE MINES &amp; ASTEROIDS · A BOSS AWAITS EVERY 3RD SECTOR';
    startPrompt.textContent = 'PRESS SPACE TO RELAUNCH';
    finalScoreWrap.classList.remove('hidden');
    finalScoreEl.textContent = 'FINAL SCORE  ' + score;
    highScoreEl.textContent = 'HIGH SCORE   ' + highScore;
  }

  function spawnCritter(){
    const roll = Math.random();
    const mineChance = Math.min(0.08 + level*0.006, 0.16);
    const asteroidChance = 0.16;
    let base;
    if(roll < mineChance){ base = MINE; }
    else if(roll < mineChance + asteroidChance){ base = ASTEROID; }
    else {
      const roll2 = Math.random();
      const pool = roll2 < 0.04 ? CRITTERS.filter(f=>f.rare) : CRITTERS.filter(f=>!f.rare);
      base = pool[Math.floor(Math.random()*pool.length)];
    }
    const x = base.r + Math.random()*(W - base.r*2);
    const isBomb = base.key === 'mine';
    const isAsteroid = base.key === 'asteroid';
    const inst = {
      ...base,
      x, y: -30,
      vy: (base.speed + level*0.12) * (1.6 + Math.random()*0.5),
      hpLeft: base.hp || 1,
      phase: Math.random()*Math.PI*2,
      bomb: isBomb,
      asteroid: isAsteroid,
    };
    if(isAsteroid){
      inst.rot = 0;
      inst.rockPts = Array.from({length:8}, () => 0.72 + Math.random()*0.5);
    }
    if(base.shooter){ inst.shootT = 70 + Math.random()*50; }
    critters.push(inst);
  }

  function spawnParticles(x, y, color, n=14){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const spd = 1 + Math.random()*3.2;
      particles.push({
        x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
        life: 26 + Math.random()*14, maxLife: 40, color
      });
    }
  }

  function fire(){
    if(fireCooldown > 0) return;
    bullets.push({ x: player.x, y: player.y - 24, vy: -10 });
    bullets.push({ x: player.x - 12, y: player.y - 14, vy: -10 });
    bullets.push({ x: player.x + 12, y: player.y - 14, vy: -10 });
    fireCooldown = 9;
    sfxShoot();
  }

  function update(){
    frame++;
    if(shakeT > 0) shakeT--;

    // stars always drift, even on menu
    for(const s of stars){
      s.y += s.z * (state==='playing' ? 1.6 : 0.6);
      if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
    }

    if(state !== 'playing') return;

    if(player.invulnT > 0) player.invulnT--;

    // background chiptune loop, tempo rises slightly with sector level, urgent during boss fights
    const musicStepFrames = Math.max(7, (bossActive ? 11 : 16) - level);
    if(!muted && frame % musicStepFrames === 0) playMusicStep();

    // movement
    const left = keys['ArrowLeft'] || keys['KeyA'] || touchLeft;
    const right = keys['ArrowRight'] || keys['KeyD'] || touchRight;
    if(left) player.x -= player.speed;
    if(right) player.x += player.speed;
    player.x = Math.max(22, Math.min(W-22, player.x));
    player.thrust = (left||right) ? 1 : 0;

    if(fireCooldown > 0) fireCooldown--;
    if(firePressed) fire();

    // bullets
    for(const b of bullets) b.y += b.vy;
    bullets = bullets.filter(b => b.y > -20);

    // boss warning countdown, then spawn
    if(bossWarnT > 0){
      bossWarnT--;
      if(bossWarnT === 0) spawnBoss();
    }

    // spawn regular waves only when no boss encounter is active
    if(!bossActive && bossWarnT <= 0){
      spawnTimer++;
      if(spawnTimer >= spawnInterval){
        spawnTimer = 0;
        spawnCritter();
      }
    }

    // critters
    for(const f of critters){
      f.y += f.vy;
      f.phase += 0.05;
      f.x += Math.sin(f.phase) * f.wobble;
      f.x = Math.max(f.r, Math.min(W-f.r, f.x));
      if(f.asteroid) f.rot += 0.02;
      if(f.shooter && f.y > 20 && !bossActive){
        f.shootT--;
        if(f.shootT <= 0){
          const dx = player.x - f.x, dy = player.y - f.y;
          const d = Math.max(1, Math.hypot(dx, dy));
          const spd = 3.0;
          enemyBullets.push({ x: f.x, y: f.y, vx: dx/d*spd, vy: dy/d*spd });
          sfxEnemyShoot();
          f.shootT = 80 + Math.random()*60;
        }
      }
    }

    // boss behavior
    if(bossActive && boss){
      boss.phase += 0.02;
      boss.x = W/2 + Math.sin(boss.phase) * 140;
      boss.y = boss.baseY + Math.sin(boss.phase*2) * 10;
      boss.shootT--;
      if(boss.shootT <= 0){
        const tier = Math.max(1, Math.round(level/3));
        const count = Math.min(3 + tier, 7);
        const spread = Math.PI/2.4;
        for(let i=0;i<count;i++){
          const t = count===1 ? 0 : (i/(count-1) - 0.5);
          const angle = Math.PI/2 + t*spread;
          enemyBullets.push({ x: boss.x, y: boss.y+34, vx: Math.cos(angle)*3.2, vy: Math.sin(angle)*3.2 });
        }
        sfxEnemyShoot();
        boss.shootT = Math.max(40, 76 - tier*5);
      }
    }

    // enemy bullets
    for(const b of enemyBullets){ b.x += b.vx; b.y += b.vy; }
    enemyBullets = enemyBullets.filter(b => b.y > -30 && b.y < H+30 && b.x > -30 && b.x < W+30);
    for(const b of enemyBullets){
      if(b.dead) continue;
      const dx = b.x - player.x, dy = b.y - player.y;
      if(dx*dx + dy*dy < 18*18){
        b.dead = true;
        spawnParticles(b.x, b.y, '#ff6b4d', 8);
        loseLife(1);
      }
    }
    enemyBullets = enemyBullets.filter(b => !b.dead);

    // bullet-critter collisions
    for(const f of critters){
      if(f.dead) continue;
      for(const b of bullets){
        if(b.dead) continue;
        const dx = b.x - f.x, dy = b.y - f.y;
        if(dx*dx + dy*dy < (f.r+4)*(f.r+4)){
          b.dead = true;
          f.hpLeft--;
          if(f.hpLeft <= 0){
            f.dead = true;
            if(f.bomb){
              sfxBomb();
              score = Math.max(0, score - 20);
              shakeT = 14;
              flashRed();
              spawnParticles(f.x, f.y, '#ff2f2f', 22);
            } else if(f.asteroid){
              sfxRock();
              score += f.score;
              spawnParticles(f.x, f.y, f.color, 12);
            } else {
              sfxPop(f.score);
              score += f.score;
              spawnParticles(f.x, f.y, f.color, 14);
            }
          } else {
            spawnParticles(b.x, b.y, '#fff', 4);
          }
        }
      }
    }

    // bullet-boss collisions
    if(bossActive && boss){
      for(const b of bullets){
        if(b.dead) continue;
        const dx = b.x - boss.x, dy = b.y - boss.y;
        if(dx*dx + dy*dy < 44*44){
          b.dead = true;
          boss.hp--;
          spawnParticles(b.x, b.y, '#fff', 3);
          if(boss.hp <= 0){
            bossActive = false;
            score += 250 + level*15;
            spawnParticles(boss.x, boss.y, '#ffcf5c', 46);
            shakeT = 26;
            sfxBossDefeat();
            boss = null;
            enemyBullets = [];
          }
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);

    // critter reaching bottom / hitting player
    for(const f of critters){
      if(f.dead) continue;
      const dx = f.x - player.x, dy = f.y - player.y;
      const hitDist = f.r + 16;
      if(dx*dx + dy*dy < hitDist*hitDist){
        f.dead = true;
        loseLife(1);
        spawnParticles(f.x, f.y, f.bomb ? '#ff2f2f' : (f.asteroid ? f.color : '#fff'), 18);
        if(f.bomb) sfxBomb(); else if(f.asteroid) sfxRock(); else sfxHit();
        continue;
      }
      if(f.y - f.r > H){
        f.dead = true;
        if(!f.bomb && !f.asteroid) loseLife(1);
      }
    }
    critters = critters.filter(f => !f.dead);

    // boss body colliding with player
    if(bossActive && boss){
      const dx = boss.x - player.x, dy = boss.y - player.y;
      if(dx*dx + dy*dy < (44+15)*(44+15)) loseLife(1);
    }

    // particles
    for(const p of particles){
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    // level progression
    const newLevel = 1 + Math.floor(score / 300);
    if(newLevel !== level){
      level = newLevel;
      spawnInterval = Math.max(24, 70 - level*4);
      if(level % 3 === 0 && level > lastBossLevel && !bossActive && bossWarnT <= 0){
        lastBossLevel = level;
        bossWarnT = 90;
        critters = [];
        enemyBullets = [];
        sfxBossWarn();
      } else {
        sfxLevel();
      }
    }

    updateHud();
  }

  function spawnBoss(){
    const tier = Math.max(1, level/3);
    boss = {
      x: W/2, y: 120, baseY: 120,
      hp: 40 + tier*22, maxHp: 40 + tier*22,
      shootT: 60, phase: 0,
    };
    bossActive = true;
    sfxBossAppear();
  }

  function loseLife(n){
    if(player.invulnT > 0) return;
    lives -= n;
    player.invulnT = 70;
    shakeT = 16;
    flashRed();
    if(lives <= 0){ lives = 0; updateHud(); endGame(); }
  }

  function flashRed(){
    flashEl.style.background = 'rgba(255,40,40,0.35)';
    setTimeout(()=>{ flashEl.style.background = 'rgba(255,40,40,0.0)'; }, 90);
  }

  function updateHud(){
    scoreLine.textContent = 'SCORE ' + score;
    levelLine.textContent = 'SECTOR ' + level + (bossActive ? ' · BOSS' : '');
    livesLine.textContent = 'SHIPS ' + '▲'.repeat(Math.max(0,lives));
  }

  // ---- drawing ----
  function drawStars(){
    ctx.save();
    for(const s of stars){
      ctx.fillStyle = s.size===2 ? 'rgba(180,220,255,0.9)' : 'rgba(140,170,220,0.55)';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.restore();
  }

  function drawShip(){
    ctx.save();
    ctx.translate(player.x, player.y);
    // thruster flame
    const flick = 6 + Math.sin(frame*0.9)*3 + (player.thrust?4:0);
    const grad = ctx.createLinearGradient(0,10,0,10+flick);
    grad.addColorStop(0, 'rgba(255,180,60,0.95)');
    grad.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-7,10); ctx.lineTo(7,10); ctx.lineTo(0,10+flick); ctx.closePath();
    ctx.fill();

    // hull
    ctx.shadowColor = '#3df5ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#c9fbff';
    ctx.beginPath();
    ctx.moveTo(0,-20);
    ctx.lineTo(15,12);
    ctx.lineTo(6,8);
    ctx.lineTo(0,14);
    ctx.lineTo(-6,8);
    ctx.lineTo(-15,12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff2fd0';
    ctx.beginPath();
    ctx.moveTo(0,-20); ctx.lineTo(9,2); ctx.lineTo(-9,2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#3df5ff';
    ctx.beginPath();
    ctx.arc(0,-4,3.4,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function drawBullets(){
    ctx.save();
    ctx.shadowColor = '#3df5ff';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#e8ffff';
    for(const b of bullets){
      ctx.fillRect(b.x-1.5, b.y-9, 3, 14);
    }
    ctx.restore();
  }

  function drawBlip(f){
    const r = f.r;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = f.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r*0.35,-r*0.8); ctx.lineTo(-r*0.55,-r*1.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.35,-r*0.8); ctx.lineTo(r*0.55,-r*1.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r*0.55,-r*1.35,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.55,-r*1.35,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#04030a';
    ctx.beginPath(); ctx.arc(-r*0.32,-r*0.1,r*0.16,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.32,-r*0.1,r*0.16,0,Math.PI*2); ctx.fill();
  }

  function drawZog(f){
    const r = f.r;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.lineTo(r*0.9, r*0.6); ctx.lineTo(r*0.4, r*0.5); ctx.lineTo(0, r*0.85);
    ctx.lineTo(-r*0.4, r*0.5); ctx.lineTo(-r*0.9, r*0.6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,-r*0.1,r*0.32,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#04030a';
    ctx.beginPath(); ctx.arc(0,-r*0.1,r*0.15,0,Math.PI*2); ctx.fill();
  }

  function drawSquig(f){
    const r = f.r;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.ellipse(0,-r*0.1, r, r*0.75, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = f.color; ctx.lineWidth = r*0.18; ctx.lineCap = 'round';
    for(let i=-1;i<=1;i++){
      const baseX = i*r*0.5;
      const wob = Math.sin(f.phase*2 + i) * r*0.25;
      ctx.beginPath();
      ctx.moveTo(baseX, r*0.5);
      ctx.quadraticCurveTo(baseX+wob, r*0.9, baseX, r*1.25);
      ctx.stroke();
    }
    ctx.fillStyle = '#04030a';
    ctx.beginPath(); ctx.arc(-r*0.3,-r*0.15,r*0.13,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.3,-r*0.15,r*0.13,0,Math.PI*2); ctx.fill();
  }

  function drawKrix(f){
    const r = f.r;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = Math.PI/3*i - Math.PI/2;
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    for(let i=0;i<6;i++){
      const a = Math.PI/3*i - Math.PI/2;
      const px2 = Math.cos(a)*r*1.4, py2 = Math.sin(a)*r*1.4;
      const pa = a - 0.25, pb = a + 0.25;
      ctx.beginPath();
      ctx.moveTo(Math.cos(pa)*r*0.85, Math.sin(pa)*r*0.85);
      ctx.lineTo(px2, py2);
      ctx.lineTo(Math.cos(pb)*r*0.85, Math.sin(pb)*r*0.85);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#04030a';
    ctx.fillRect(-r*0.35,-r*0.12,r*0.7,r*0.24);
  }

  function drawBlorp(f){
    const r = f.r;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    const bumps = 7;
    for(let i=0;i<=bumps;i++){
      const a = (i/bumps)*Math.PI*2;
      const wob = 1 + Math.sin(a*3 + f.phase*1.5)*0.12;
      const px = Math.cos(a)*r*wob, py = Math.sin(a)*r*wob*0.85 + r*0.1;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#04030a'; ctx.lineWidth = r*0.12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-r*0.28,-r*0.05,r*0.18,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.28,-r*0.05,r*0.18,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
  }

  function drawNova(f){
    const r = f.r;
    const pulse = 1 + Math.sin(frame*0.15)*0.08;
    ctx.fillStyle = f.color;
    const spikes = 8;
    ctx.beginPath();
    for(let i=0;i<spikes*2;i++){
      const a = (Math.PI/spikes)*i;
      const rad = (i%2===0 ? r*pulse : r*0.42);
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(0,0,r*0.22,0,Math.PI*2); ctx.fill();
  }

  function drawMine(f){
    const r = f.r;
    ctx.fillStyle = '#241014';
    ctx.beginPath(); ctx.arc(0,0,r*0.78,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = f.color; ctx.lineWidth = 2;
    for(let i=0;i<8;i++){
      const a = Math.PI/4*i;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.78, Math.sin(a)*r*0.78);
      ctx.lineTo(Math.cos(a)*r*1.25, Math.sin(a)*r*1.25);
      ctx.stroke();
    }
    const on = Math.floor(frame/10) % 2 === 0;
    ctx.fillStyle = on ? f.color : 'rgba(255,47,47,0.25)';
    ctx.beginPath(); ctx.arc(0,-r*0.05,r*0.16,0,Math.PI*2); ctx.fill();
  }

  function drawVex(f){
    const r = f.r;
    const charge = f.shootT !== undefined ? Math.max(0, 1 - f.shootT/18) : 0;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(0, r*0.9);
    ctx.lineTo(r*0.85, -r*0.5); ctx.lineTo(r*0.35, -r*0.25); ctx.lineTo(0, -r*0.55);
    ctx.lineTo(-r*0.35, -r*0.25); ctx.lineTo(-r*0.85, -r*0.5);
    ctx.closePath(); ctx.fill();
    const eyeR = r*0.3 + charge*r*0.15;
    ctx.fillStyle = `rgba(255, ${Math.round(140+charge*100)}, ${Math.round(120+charge*100)}, ${0.85+charge*0.15})`;
    ctx.beginPath(); ctx.arc(0, r*0.05, eyeR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#04030a';
    ctx.beginPath(); ctx.arc(0, r*0.05, eyeR*0.4, 0, Math.PI*2); ctx.fill();
  }

  function drawAsteroid(f){
    const r = f.r;
    ctx.save();
    ctx.rotate(f.rot || 0);
    ctx.fillStyle = f.color;
    const pts = f.rockPts || [1,1,1,1,1,1,1,1];
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const a = (Math.PI*2/pts.length)*i;
      const rad = r*pts[i];
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(20,22,30,0.5)';
    ctx.beginPath(); ctx.arc(-r*0.25,-r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.2, r*0.25, r*0.14, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const CRITTER_DRAWERS = { blip:drawBlip, zog:drawZog, squig:drawSquig, krix:drawKrix, blorp:drawBlorp, nova:drawNova, vex:drawVex, mine:drawMine, asteroid:drawAsteroid };

  function drawCritters(){
    ctx.save();
    for(const f of critters){
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      (CRITTER_DRAWERS[f.key] || drawBlip)(f);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawEnemyBullets(){
    ctx.save();
    ctx.shadowColor = '#ff6b4d';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffb199';
    for(const b of enemyBullets){
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawBoss(){
    const b = boss;
    const hpFrac = b.hp / b.maxHp;
    const stageColor = hpFrac > 0.66 ? '#3dff8a' : hpFrac > 0.33 ? '#ffe93d' : '#ff4d4d';
    const charge = Math.max(0, 1 - b.shootT/18);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.shadowColor = stageColor;
    ctx.shadowBlur = 22;
    ctx.fillStyle = stageColor;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = Math.PI/3*i - Math.PI/2 + Math.sin(frame*0.02)*0.05;
      const px = Math.cos(a)*50, py = Math.sin(a)*50;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    for(let i=0;i<5;i++){
      const a = (Math.PI*2/5)*i + frame*0.015;
      const px = Math.cos(a)*72, py = Math.sin(a)*72*0.6;
      ctx.strokeStyle = stageColor; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*46, Math.sin(a)*46*0.6);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,${Math.round(120+charge*120)},${Math.round(90+charge*120)},0.95)`;
      ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#04030a';
      ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#04030a';
    ctx.fillRect(-24, -8, 48, 16);
    ctx.restore();
  }

  function drawBossBar(){
    const barX = 70, barY = 42, barW = W-140, barH = 10;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(barX, barY, barW, barH);
    const frac = Math.max(0, boss.hp / boss.maxHp);
    const stageColor = frac > 0.66 ? '#3dff8a' : frac > 0.33 ? '#ffe93d' : '#ff4d4d';
    ctx.fillStyle = stageColor;
    ctx.shadowColor = stageColor; ctx.shadowBlur = 8;
    ctx.fillRect(barX, barY, barW*frac, barH);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#e8ffff'; ctx.textAlign = 'center';
    ctx.fillText('BOSS', W/2, barY-4);
    ctx.restore();
  }

  function drawBossWarning(){
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(frame*0.3)*0.5;
    ctx.fillStyle = '#ff4d4d';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4d4d'; ctx.shadowBlur = 14;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText('WARNING', W/2, H/2-14);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('SECTOR BOSS APPROACHING', W/2, H/2+10);
    ctx.restore();
  }

  function drawParticles(){
    ctx.save();
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shakeT > 0){
      ctx.translate((Math.random()-0.5)*shakeT*0.6, (Math.random()-0.5)*shakeT*0.6);
    }
    drawStars();
    if(state === 'playing' || state === 'paused'){
      drawCritters();
      if(bossActive && boss) drawBoss();
      drawEnemyBullets();
      drawBullets();
      drawParticles();
      if(!(player.invulnT > 0 && Math.floor(frame/4) % 2 === 0)) drawShip();
      if(bossActive && boss) drawBossBar();
      if(bossWarnT > 0) drawBossWarning();
    }
    ctx.restore();
  }

  function loop(){
    update();
    render();
    requestAnimationFrame(loop);
  }

  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
